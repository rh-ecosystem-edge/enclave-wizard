- name: Ensure LVMCluster exists
  vars:
    _spec: "storage:\n  deviceClasses:\n    - name: {{ lvmsDefaults.deviceClassName }}\n      default: {{ lvmsDefaults.defaultStorageClass\
      \ }}\n      thinPoolConfig:\n        name: {{ lvmsDefaults.thinPoolConfig.name }}\n        sizePercent: {{ lvmsDefaults.thinPoolConfig.sizePercent\
      \ }}\n        overprovisionRatio: {{ lvmsDefaults.thinPoolConfig.overprovisionRatio }}\n      {% if lvmsConfig is defined\
      \ and lvmsConfig.deviceSelector is defined and lvmsConfig.deviceSelector.optionalPaths is defined %}{{ lvmsConfigDefaults\
      \ | combine(lvmsConfig, recursive=true) | to_yaml | indent(6) }}{% endif %}\n"
  register: r_lvmcluster_exists
  ansible.builtin.debug:
    msg: 'NOOP: Ensure LVMCluster exists'
